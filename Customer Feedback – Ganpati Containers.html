<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Customer Feedback – Ganpati Containers</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mute:#5d6b7c;--line:#d9dfe7;--acc:#0f6b4f;--accbg:#e3f3ec;--accink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b212a;--ink:#e8edf3;--mute:#9aa7b6;--line:#2f3945;--acc:#3fbf93;--accbg:#173a2e;--accink:#0b1a14}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b212a;--ink:#e8edf3;--mute:#9aa7b6;--line:#2f3945;--acc:#3fbf93;--accbg:#173a2e;--accink:#0b1a14}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 14px 40px}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 18px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.f{display:block;margin-bottom:12px}
.f span,.q p{display:block;font-weight:600;margin:0 0 6px}
.f input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.q p small{color:var(--mute);font-weight:400}
.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.opts label{cursor:pointer}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts div{border:1px solid var(--line);border-radius:8px;padding:8px 2px;text-align:center;height:100%;font-size:.72rem;line-height:1.2;color:var(--mute);background:var(--bg)}
.opts b{display:block;font-size:1.1rem;color:var(--ink);margin-bottom:3px}
.opts input:checked+div{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.opts input:checked+div b{color:var(--accink)}
.opts input:focus-visible+div{outline:2px solid var(--acc);outline-offset:2px}
.perm label{display:block;margin:6px 0}
button,.btn{display:inline-block;background:var(--acc);color:var(--accink);border:0;border-radius:8px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;margin:4px 6px 4px 0}
.btn.alt{background:var(--accbg);color:var(--acc)}
.err{color:#c0392b;font-weight:600;margin:8px 0}
#done{display:none}
#out{height:220px;font-size:.85rem}
@media (max-width:420px){.opts div{font-size:.65rem}}
</style>
</head>
<body>
<div class="wrap">
<h1>Your experience with Ganpati Containers</h1>
<p class="sub">Takes about 2 minutes. Rate each point from 1 to 5. Your honest view helps us improve.</p>

<form id="form" novalidate>
<div class="card">
<label class="f"><span>Full name *</span><input id="name" autocomplete="name"></label>
<label class="f"><span>Designation *</span><input id="desig"></label>
<label class="f"><span>Company name *</span><input id="comp" autocomplete="organization"></label>
<label class="f"><span>Email *</span><input id="email" type="email" autocomplete="email"></label>
</div>
<div id="qs"></div>
<div class="card">
<label class="f"><span>Anything else you would like to say, in your own words? (optional)</span><textarea id="cmt" rows="3"></textarea></label>
</div>
<div id="err" class="err"></div>
<button type="submit">Submit</button>
</form>

<div id="done" class="card">
<h2 style="margin-top:0">Thank you!</h2>
<p>One last step: please send your answers to us using any option below.</p>
<a id="mail" class="btn" target="_blank" rel="noopener">Send by email</a>
<a id="wa" class="btn alt" target="_blank" rel="noopener">Send on WhatsApp</a>
<button type="button" id="copy" class="alt btn">Copy answers</button>
<p id="cstat" style="color:var(--mute);margin:6px 0"></p>
<textarea id="out" readonly></textarea>
</div>
</div>

<script>
var Q=[
["How much has buying from us instead of Jaipur changed your freight cost?",["Increased","Slightly increased","No change","Reduced","Greatly reduced"]],
["How much has local supply improved your delivery time and stock holding?",["Worse","Slightly worse","No change","Improved","Greatly improved"]],
["How consistent are our jars (weight, neck finish)?",["Very inconsistent","Inconsistent","Acceptable","Consistent","Highly consistent"]],
["How do leakage and rejections compare with your earlier supplier?",["Much higher","Slightly higher","Same","Lower","Negligible"]],
["How does our overall quality compare with your earlier supplier?",["Much worse","Slightly worse","Same","Better","Much better"]],
["How reliable are our delivery and turnaround?",["Very unreliable","Unreliable","Average","Reliable","Highly reliable"]],
["How quickly do we respond when you raise an issue?",["Very slow","Slow","Average","Quick","Very quick"]],
["How likely are you to recommend us to someone?",["Definitely not","Unlikely","Not sure","Likely","Definitely"]]
];
var qs=document.getElementById("qs");
Q.forEach(function(q,i){
  var d=document.createElement("div");d.className="card q";
  var h='<p>'+(i+1)+'. '+q[0]+' *</p><div class="opts">';
  q[1].forEach(function(l,j){h+='<label><input type="radio" name="q'+i+'" value="'+(j+1)+'"><div><b>'+(j+1)+'</b>'+l+'</div></label>';});
  d.innerHTML=h+'</div>';qs.appendChild(d);
});
function v(id){return document.getElementById(id).value.trim();}
document.getElementById("form").addEventListener("submit",function(e){
  e.preventDefault();
  var er=document.getElementById("err");er.textContent="";
  if(!v("name")||!v("desig")||!v("comp")||!/^\S+@\S+\.\S+$/.test(v("email"))){er.textContent="Please fill in your name, designation, company and a valid email.";return;}
  var ans=[];
  for(var i=0;i<Q.length;i++){
    var c=document.querySelector('input[name="q'+i+'"]:checked');
    if(!c){er.textContent="Please answer question "+(i+1)+".";return;}
    ans.push((i+1)+". "+Q[i][0]+"\n   Rating: "+c.value+"/5 ("+Q[i][1][c.value-1]+")");
  }
  var t="Feedback for Ganpati Containers\n\nName: "+v("name")+"\nDesignation: "+v("desig")+"\nCompany: "+v("comp")+"\nEmail: "+v("email")+"\n\n"+ans.join("\n")+"\n\nComments: "+(v("cmt")||"-");
  document.getElementById("out").value=t;
  document.getElementById("mail").href="mailto:ganpaticontainers.ujjwal@gmail.com?subject="+encodeURIComponent("Feedback from "+v("name")+", "+v("comp"))+"&body="+encodeURIComponent(t);
  document.getElementById("wa").href="https://wa.me/918529107121?text="+encodeURIComponent(t);
  document.getElementById("form").style.display="none";
  document.getElementById("done").style.display="block";
  window.scrollTo(0,0);
});
document.getElementById("copy").addEventListener("click",function(){
  var o=document.getElementById("out"),s=document.getElementById("cstat");
  o.focus();o.select();
  try{navigator.clipboard.writeText(o.value).then(function(){s.textContent="Copied.";},function(){s.textContent="Please copy the text below manually.";});}
  catch(x){s.textContent="Please copy the text below manually.";}
});
</script>
</body>
</html>
